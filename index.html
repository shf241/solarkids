<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SolarKids — 天体运行少儿教学</title>
  <link rel="icon" href="assets/svg/sun.svg" type="image/svg+xml">
  <link rel="stylesheet" href="src/style.css?v=20260802-welcome-1">
</head>
<body class="welcome-active">

  <!-- 首次进入欢迎页：应用完成初始化后启用“开始探索” -->
  <section
    id="welcome-screen"
    class="welcome-screen"
    role="dialog"
    aria-modal="true"
    aria-labelledby="welcome-title"
    aria-describedby="welcome-description"
  >
    <div class="welcome-screen__orbit welcome-screen__orbit--outer" aria-hidden="true"></div>
    <div class="welcome-screen__orbit welcome-screen__orbit--inner" aria-hidden="true"></div>
    <span class="welcome-screen__planet welcome-screen__planet--blue" aria-hidden="true"></span>
    <span class="welcome-screen__planet welcome-screen__planet--orange" aria-hidden="true"></span>

    <div class="welcome-card">
      <img
        class="welcome-card__sun"
        src="assets/svg/sun.svg"
        alt=""
        aria-hidden="true"
      >
      <p class="welcome-card__eyebrow" data-i18n="welcome.eyebrow">欢迎来到</p>
      <h1 id="welcome-title" class="welcome-card__title">SolarKids</h1>
      <p
        id="welcome-description"
        class="welcome-card__description"
        data-i18n="welcome.description"
      >和太阳、月球与八大行星一起出发，探索会运动的宇宙课堂。</p>
      <div class="welcome-card__features" aria-hidden="true">
        <span>🪐 <span data-i18n="welcome.feature.orbits">观察天体运行</span></span>
        <span>🚀 <span data-i18n="welcome.feature.visit">探访行星</span></span>
        <span>☄️ <span data-i18n="welcome.feature.phenomena">探索天文现象</span></span>
      </div>
      <button
        id="btn-enter-app"
        class="welcome-card__button"
        type="button"
        disabled
      >
        <span class="welcome-card__button-icon" aria-hidden="true">✦</span>
        <span data-i18n="welcome.loading">正在准备太阳系…</span>
      </button>
      <p class="welcome-card__hint" data-i18n="welcome.hint">点击按钮，开始你的太空旅程</p>
    </div>
  </section>

  <!-- ============================================
      主布局：Canvas | 侧面板 | 底部控制栏
      ============================================ -->
  <div id="app" inert>

    <!-- Canvas 画布区（成员3负责） -->
    <div id="canvas-container">
      <canvas id="main-canvas" tabindex="0"></canvas>
      <div id="canvas-view-status" class="canvas-view-status" aria-live="polite">
        视角：太阳系总览
      </div>
    </div>

    <!-- 侧边信息面板（成员1+2+3共用） -->
    <aside id="side-panel">
      <h2 id="planet-name" class="planet-info__title">
        <img
          class="planet-info__title-icon"
          src="assets/svg/earth.svg"
          alt=""
        >
        <span class="planet-info__title-text" data-i18n="panel.select">选择一颗行星</span>
      </h2>
      <p id="planet-desc" data-i18n="panel.selectHint">点击画布中的天体，查看详细信息</p>
      <hr class="divider">
      <div class="planet-info__stats" id="planet-stats">
        <!-- JS 动态填充 -->
      </div>
      <div id="planet-sections"></div>
      <div class="planet-info__actions" id="planet-actions"></div>
    </aside>

    <!-- 底部控制栏 -->
    <nav id="control-bar">
      <!-- 播放控制 -->
      <div class="control-group">
        <button class="btn btn--icon" id="btn-play" title="播放/暂停" aria-label="播放或暂停" data-i18n-title="action.playPause" data-i18n-aria-label="action.playPause">
          <img class="control-icon" src="assets/svg/icon-play.svg" alt="">
        </button>
        <button class="btn btn--icon" id="btn-speed-down" title="减速" aria-label="减速" data-i18n-title="action.speedDown" data-i18n-aria-label="action.speedDown">⏪</button>
        <input type="range" id="speed-slider" min="1" max="10" value="5" title="速度">
        <button class="btn btn--icon" id="btn-speed-up" title="加速" aria-label="加速" data-i18n-title="action.speedUp" data-i18n-aria-label="action.speedUp">⏩</button>
      </div>

      <!-- 视角控制 -->
      <div class="control-group">
        <button class="btn btn--icon" id="btn-zoom-in" title="放大" aria-label="放大" data-i18n-title="action.zoomIn" data-i18n-aria-label="action.zoomIn">
          <img class="control-icon" src="assets/svg/icon-zoom-in.svg" alt="">
        </button>
        <button class="btn btn--icon" id="btn-zoom-out" title="缩小" aria-label="缩小" data-i18n-title="action.zoomOut" data-i18n-aria-label="action.zoomOut">
          <img class="control-icon" src="assets/svg/icon-zoom-out.svg" alt="">
        </button>
        <button class="btn btn--icon" id="btn-reset-view" title="重置视角" aria-label="重置视角" data-i18n-title="action.resetView" data-i18n-aria-label="action.resetView">
          <img class="control-icon" src="assets/svg/icon-reset-view.svg" alt="">
        </button>
        <button
          class="btn btn--ghost"
          id="btn-toggle-orbits"
          title="显示或隐藏轨道"
          aria-label="显示或隐藏行星轨道"
          aria-pressed="true"
          data-i18n-title="nav.orbits"
          data-i18n-aria-label="nav.orbits"
        >
          <span aria-hidden="true">🪐</span>
          <span data-i18n="nav.orbits">轨道</span>
        </button>
      </div>

      <!-- 模块6：互斥视角与现象入口 -->
      <div
        class="control-group control-group--experiences"
        role="group"
        aria-label="视角与天文现象"
        data-i18n-aria-label="nav.experiences"
      >
        <button
          class="btn btn--ghost"
          id="btn-view-overview"
          title="太阳系总览视角（快捷键 0）"
          aria-label="太阳系总览"
          aria-pressed="true"
          data-i18n-title="nav.overview"
          data-i18n-aria-label="nav.overview"
        >
          <span aria-hidden="true">🌌</span>
          <span data-i18n="nav.overview">太阳系总览</span>
        </button>
        <button
          class="btn btn--ghost"
          id="btn-view-earth"
          title="站在地球表面观察天空（快捷键 E）"
          aria-label="地表视角"
          aria-pressed="false"
          data-i18n-title="nav.earthView"
          data-i18n-aria-label="nav.earthView"
        >
          <span aria-hidden="true">🌍</span>
          <span data-i18n="nav.earthView">地表视角</span>
        </button>
        <button
          class="btn btn--ghost"
          id="btn-eclipse"
          title="日食/月食模拟"
          aria-label="日食/月食模拟"
          aria-pressed="false"
          data-i18n-title="nav.eclipse"
          data-i18n-aria-label="nav.eclipse"
        >
          <span aria-hidden="true">🌑</span>
          <span data-i18n="nav.eclipse">日食/月食</span>
        </button>
        <button
          class="btn btn--ghost"
          id="btn-comet"
          title="哈雷彗星"
          aria-label="哈雷彗星"
          aria-pressed="false"
          data-i18n-title="nav.comet"
          data-i18n-aria-label="nav.comet"
        >
          <span aria-hidden="true">☄️</span>
          <span data-i18n="nav.comet">彗星</span>
        </button>
        <button
          class="btn btn--ghost"
          id="btn-magnetic"
          title="磁场演示"
          aria-label="磁场演示"
          aria-pressed="false"
          data-i18n-title="nav.magnetic"
          data-i18n-aria-label="nav.magnetic"
        >
          <span aria-hidden="true">🧲</span>
          <span data-i18n="nav.magnetic">磁场</span>
        </button>
        <button
          class="btn btn--ghost"
          id="btn-solar-rain"
          title="太阳雨"
          aria-label="太阳雨"
          aria-pressed="false"
          data-i18n-title="nav.solarRain"
          data-i18n-aria-label="nav.solarRain"
        >
          <span aria-hidden="true">🌧️</span>
          <span data-i18n="nav.solarRain">太阳雨</span>
        </button>
        <button
          class="btn btn--ghost"
          id="btn-orbit-game"
          title="轨道小游戏"
          aria-label="轨道小游戏"
          aria-pressed="false"
          data-i18n-title="nav.game"
          data-i18n-aria-label="nav.game"
        >
          <span aria-hidden="true">🎯</span>
          <span data-i18n="nav.game">轨道小游戏</span>
        </button>
      </div>

      <!-- 设置 -->
      <div class="control-group">
        <button class="btn btn--icon" id="btn-astronomy-advisor" title="AI天文小顾问" aria-label="打开AI天文小顾问" data-i18n-title="nav.advisor" data-i18n-aria-label="nav.advisor">
          <span aria-hidden="true">🤖</span>
        </button>
        <button class="btn btn--icon" id="btn-learning-room" title="多人学习房" aria-label="打开多人学习房" data-i18n-title="nav.learningRoom" data-i18n-aria-label="nav.learningRoom">
          <span aria-hidden="true">🛰️</span>
        </button>
        <button class="btn btn--icon" id="btn-skin" title="换肤" aria-label="打开天体换肤" data-i18n-title="nav.skin" data-i18n-aria-label="nav.skin">
          <img class="control-icon" src="assets/svg/icon-skin.svg" alt="">
        </button>
        <button class="btn btn--icon" id="btn-lang" title="语言切换" aria-label="切换语言" data-i18n-title="nav.language" data-i18n-aria-label="nav.language">
          <img class="control-icon" src="assets/svg/icon-language.svg" alt="">
        </button>
        <button class="btn btn--icon" id="btn-help" title="帮助" aria-label="打开帮助" data-i18n-title="nav.help" data-i18n-aria-label="nav.help">
          <img class="control-icon" src="assets/svg/icon-help.svg" alt="">
        </button>
      </div>
    </nav>

  </div>

  <!-- ============================================
       弹窗容器（按需由 JS 填充）
       ============================================ -->
  <div id="modal-container"></div>

  <!-- ============================================
       脚本（模块化加载）
       注：开发阶段用 TypeScript 编译后的 bundle
       ============================================ -->
  <script type="module" src="dist/main.js?v=20260802-welcome-1"></script>
</body>
</html>
